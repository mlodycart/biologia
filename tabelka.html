<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biologia - Tabelka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-gutter: stable; overflow-y: scroll; }
        body { background-color: #0b0d0f; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden; width: 100%; max-width: 100vw; }
        
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .glow {
            position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 700px; height: 350px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(76, 175, 80, 0.05) 50%, transparent 80%);
            filter: blur(80px); pointer-events: none; z-index: 0;
        }

        header { position: relative; z-index: 1001; width: 100%; display: flex; justify-content: center; padding: 20px 15px; }
        .nav-capsule {
            background: rgba(18, 22, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1350px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; }
        .brand-icon { width: 10px; height: 10px; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff; }
        .nav-links { display: flex; gap: 18px; list-style: none; }
        .nav-links a { color: #9aa0a6; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #00e5ff; }
        .nav-btn {
            background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s;
        }
        .nav-btn:hover { background: #00e5ff; color: #0b0d0f; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        .tab-content { position: relative; z-index: 10; display: block; width: 100%; max-width: 1350px; padding: 10px 15px 60px 15px; }
        
        .table-header-bar { 
            position: sticky; top: 15px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; gap: 15px; 
            margin-bottom: 20px; background: rgba(18, 22, 26, 0.9); backdrop-filter: blur(12px); padding: 15px 20px; 
            border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        
        .zoom-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .zoom-controls span { font-size: 14px; color: #9aa0a6; font-weight: 600; text-transform: uppercase; }
        
        .zoom-btn { 
            background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 40px; height: 40px; font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; text-decoration: none;
        }
        .zoom-btn:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.1); color: #00e5ff; }
        #zoom-level-text { font-size: 16px; color: #00e5ff; min-width: 50px; text-align: center; font-weight: 700; }
        
        .search-box { position: relative; display: flex; align-items: center; flex-grow: 1; min-width: 220px; max-width: 400px; height: 42px; }
        .search-input { width: 100%; height: 42px; padding: 0 40px 0 14px; font-family: inherit; font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; background: rgba(255, 255, 255, 0.05); color: white; outline: none; }
        .search-input:focus { border-color: #00e5ff; }
        
        .clear-search-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #00e5ff; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 4px; font-size: 20px; font-weight: 700;
        }
        
        /* Czysta ramka tabeli dopasowująca wysokość do zawartości bez pustego miejsca i bez bocznych luk */
        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background: rgba(18, 22, 26, 0.8); 
            backdrop-filter: blur(12px);
        }
        
        #table-zoom-wrapper { width: 100%; }
        
        table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06); word-wrap: break-word; }
        th { background: rgba(0, 0, 0, 0.4); font-weight: 700; font-size: 1.05em; border-bottom: 2px solid rgba(255, 255, 255, 0.1); color: #00e5ff; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        tr.highlighted-row { background: rgba(0, 229, 255, 0.15) !important; color: #fff !important; font-weight: bold; }
        tr.highlighted-row td { color: #fff !important; }
        tr.highlighted-row strong { color: #00e5ff !important; }

        @media(max-width: 900px) { .nav-links { display: none; } }
    </style>
</head>
<body>

    <div class="glow"></div>

    <header>
        <nav class="nav-capsule">
            <a href="index.html" class="brand"><span class="brand-icon"></span>Biologia</a>
            <ul class="nav-links">
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="quiz_wpisywany.html">Quiz Wpisz</a></li>
                <li><a href="quiz_abcd.html">Quiz ABCD</a></li>
            </ul>
            <a href="tabelka.html" class="nav-btn">Baza Wiedzy</a>
        </nav>
    </header>

    <div class="tab-content">
        <div class="table-header-bar">
            <div class="zoom-controls">
                <span>Rozmiar:</span>
                <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
                <span id="zoom-level-text">100%</span>
                <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
                <button class="zoom-btn" onclick="resetZoom()" title="Resetuj zoom">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
            </div>
            <form class="search-box" action="javascript:void(0);" onsubmit="searchTable(); return false;">
                <input type="text" id="table-search-input" class="search-input" placeholder="Szukaj zagadnienia..." autocomplete="off" oninput="toggleClearButton()">
                <button type="button" id="clear-search-btn" class="clear-search-btn" onclick="clearSearch()" title="Wyczyść">&#10005;</button>
            </form>
        </div>

        <div class="table-responsive">
            <div id="table-zoom-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 35%;">Zagadnienie</th>
                            <th style="width: 65%;">Definicja</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="historyData.js"></script>
    <script>
        function buildTable() {
            document.getElementById('table-body').innerHTML = historyData.map((w, idx) => `
                <tr id="row-word-${idx}">
                    <td><strong>${w.title}</strong></td>
                    <td>${w.desc}</td>
                </tr>
            `).join('');
        }

        function toggleClearButton() {
            const input = document.getElementById("table-search-input");
            const clearBtn = document.getElementById("clear-search-btn");
            clearBtn.style.display = input.value.length > 0 ? "flex" : "none";
        }

        function clearSearch() {
            const input = document.getElementById("table-search-input");
            input.value = "";
            toggleClearButton();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            input.focus();
        }

        function searchTable() {
            const queryRaw = document.getElementById("table-search-input").value.trim().toLowerCase();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            if (!queryRaw) return;

            const queryWords = queryRaw.split(/\s+/).filter(w => w.length > 0);
            let matchingIndexes = [];
            
            historyData.forEach((w, idx) => {
                const combinedText = [w.title, w.desc, ...(w.titleKeywords || []), ...(w.descKeywords || [])].join(" ").toLowerCase();
                if (combinedText.includes(queryRaw) || queryWords.every(qw => combinedText.includes(qw))) {
                    matchingIndexes.push(idx);
                }
            });

            if (matchingIndexes.length >= 1) {
                const row = document.getElementById(`row-word-${matchingIndexes[0]}`);
                if (row) {
                    row.classList.add("highlighted-row");
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            document.getElementById("table-search-input").blur();
        }

        let currentZoom = parseFloat(localStorage.getItem('tableZoom')) || 1.0;
        function updateZoomDisplay() {
            const wrapper = document.getElementById('table-zoom-wrapper');
            const zoomText = document.getElementById('zoom-level-text');
            if (wrapper && zoomText) {
                // Skalowanie wielkością czcionki zapobiega rozciąganiu układu i sztucznemu przesuwaniu
                wrapper.style.fontSize = `${15 * currentZoom}px`;
                zoomText.innerText = `${Math.round(currentZoom * 100)}%`;
                localStorage.setItem('tableZoom', currentZoom);
            }
        }
        function adjustZoom(delta) { currentZoom = Math.min(Math.max(0.6, currentZoom + delta), 1.4); updateZoomDisplay(); }
        function resetZoom() { currentZoom = 1.0; updateZoomDisplay(); }

        window.onload = function() {
            buildTable();
            updateZoomDisplay();
        };
    </script>
</body>
</html>
